<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Horizon Context Memory</title>
<style>
:root{--bg:#090b10;--panel:#111620;--panel2:#171d2a;--panel3:#1d2535;--line:#2a3448;--text:#edf3ff;--muted:#8d9ab3;--blue:#7aa7ff;--cyan:#67e8f9;--green:#77e39d;--yellow:#ffd166;--red:#ff7070;--mag:#c99bff;--shadow:0 22px 70px rgba(0,0,0,.42)}
*{box-sizing:border-box}html{overflow-x:hidden}body{margin:0;min-height:100vh;color:var(--text);font:14px/1.5 ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:radial-gradient(circle at 12% -10%,rgba(103,232,249,.16),transparent 30%),radial-gradient(circle at 88% 0,rgba(201,155,255,.15),transparent 28%),linear-gradient(180deg,#0b0e14,#090b10 42%)}button,input,select,textarea{font:inherit}button{cursor:pointer}
.app{display:grid;grid-template-columns:292px minmax(0,1fr);min-height:100vh;overflow:hidden}.side{position:sticky;top:0;height:100vh;padding:24px;border-right:1px solid var(--line);background:rgba(9,11,16,.78);backdrop-filter:blur(18px);display:flex;flex-direction:column;overflow:auto}.brand{display:flex;gap:13px;align-items:center;margin-bottom:24px}.logo{width:42px;height:42px;border-radius:15px;display:grid;place-items:center;background:linear-gradient(135deg,rgba(103,232,249,.2),rgba(201,155,255,.18));border:1px solid rgba(122,167,255,.28);box-shadow:var(--shadow)}h1,h2,h3,p{margin-top:0}.brand h1{font-size:16px;margin-bottom:2px}.brand p,.muted{color:var(--muted);font-size:12px}.nav{display:grid;gap:8px;margin-bottom:22px}.nav button{border:1px solid transparent;background:transparent;color:var(--muted);text-align:left;border-radius:13px;padding:11px 12px}.nav button.active,.nav button:hover{background:var(--panel2);border-color:var(--line);color:var(--text)}
.nav details{border:1px solid transparent;border-radius:15px}.nav summary{list-style:none;color:var(--muted);border-radius:13px;padding:11px 12px;cursor:pointer}.nav summary::-webkit-details-marker{display:none}.nav summary:hover,.nav details[open] summary{background:rgba(23,29,42,.72);border-color:var(--line);color:var(--text)}.nav summary:after{content:"⌄";float:right;color:var(--muted)}.nav details[open] summary:after{content:"⌃"}.nav-more{display:grid;gap:8px;padding:8px 0 0 10px}
.sidebox{border:1px solid var(--line);border-radius:18px;background:rgba(17,22,32,.75);padding:14px;margin-top:14px}.sidebox summary{list-style:none;cursor:pointer}.sidebox summary::-webkit-details-marker{display:none}.automation-summary{display:flex;justify-content:space-between;align-items:center;gap:12px}.automation-list{display:grid;gap:14px;margin-top:14px;padding-top:14px;border-top:1px solid var(--line)}.switch{display:flex;align-items:center;justify-content:space-between;gap:12px}.switch input{width:42px;height:22px;accent-color:var(--cyan)}.side-foot{margin-top:auto;color:var(--muted);font-size:12px;padding-top:18px}
.main{padding:28px 34px 44px;min-width:0;overflow-x:hidden}.top{display:grid;grid-template-columns:minmax(260px,1fr) auto;align-items:start;gap:18px;margin-bottom:18px}.title h2{font-size:30px;line-height:1.1;margin-bottom:8px}.actions,.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}.actions{justify-content:flex-end;align-items:flex-start;min-width:0}.actionmenu{position:relative}.actionmenu summary{list-style:none}.actionmenu summary::-webkit-details-marker{display:none}.menu-panel{position:absolute;right:0;top:calc(100% + 8px);z-index:5;display:grid;grid-template-columns:repeat(2,minmax(142px,1fr));gap:8px;width:min(360px,calc(100vw - 48px));padding:10px;border:1px solid var(--line);border-radius:16px;background:rgba(17,22,32,.98);box-shadow:var(--shadow);backdrop-filter:blur(16px)}.menu-panel .btn{width:100%;text-align:left}.menu-title{grid-column:1/-1;color:var(--muted);font-size:11px;letter-spacing:.08em;text-transform:uppercase;padding:2px 4px}.btn,.mini{border:1px solid var(--line);background:var(--panel2);color:var(--text);border-radius:12px;padding:10px 13px}.btn:hover,.mini:hover{border-color:#53617c}.btn.primary{background:linear-gradient(135deg,rgba(103,232,249,.18),rgba(122,167,255,.16));border-color:rgba(103,232,249,.45)}.btn.danger,.mini.danger{color:#ffd7d7;border-color:rgba(255,112,112,.38)}.mini{padding:7px 9px;color:var(--muted);background:transparent}
.statusline{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:-2px 0 18px;padding:11px 14px;border:1px solid rgba(103,232,249,.22);border-radius:16px;background:linear-gradient(135deg,rgba(103,232,249,.08),rgba(122,167,255,.05));color:#c8d6ef}.statusline b{color:var(--text)}.statusdot{width:9px;height:9px;border-radius:999px;background:var(--green);box-shadow:0 0 0 4px rgba(119,227,157,.12)}.statusleft{display:flex;align-items:center;gap:10px}.statusright{color:var(--muted);font-size:12px}
.cards{display:grid;grid-template-columns:repeat(5,minmax(160px,1fr));gap:14px;margin-bottom:18px}.card{background:rgba(17,22,32,.83);border:1px solid var(--line);border-radius:19px;padding:16px;box-shadow:var(--shadow);transition:border-color .18s ease,transform .18s ease}.card:hover{border-color:rgba(122,167,255,.38)}.metric{display:flex;justify-content:space-between;align-items:center;color:var(--muted);font-size:12px}.metric b{font-size:23px;color:var(--text)}.bar{height:8px;border-radius:999px;background:#263045;overflow:hidden;margin-top:12px}.bar span{display:block;height:100%;border-radius:999px;background:linear-gradient(90deg,var(--cyan),var(--blue));transition:width .25s ease}
.toolbar{display:grid;grid-template-columns:minmax(240px,1fr) minmax(140px,180px) minmax(140px,180px) auto;gap:10px;margin:20px 0}.batchbar{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin:-6px 0 16px;padding:10px 12px;border:1px solid var(--line);border-radius:14px;background:rgba(103,232,249,.07)}.hidden{display:none!important}.field{border:1px solid var(--line);background:var(--panel);color:var(--text);border-radius:14px;padding:11px 13px;min-width:132px}.field:focus{outline:none;border-color:rgba(103,232,249,.55);box-shadow:0 0 0 3px rgba(103,232,249,.08)}.search{min-width:260px}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(340px,1fr));gap:14px}.memory{position:relative;min-height:208px;display:flex;flex-direction:column}.memory.selected{border-color:rgba(103,232,249,.62);box-shadow:0 0 0 1px rgba(103,232,249,.18),var(--shadow)}.memory header{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;margin-bottom:10px}.pill{display:inline-flex;align-items:center;gap:4px;font-size:11px;padding:4px 8px;border-radius:999px;border:1px solid var(--line);color:var(--muted)}.pill.domain-user{color:#eadcff;border-color:rgba(201,155,255,.45)}.pill.domain-memory{color:#d9fbff;border-color:rgba(103,232,249,.45)}.pill.on{color:#dcffe7;border-color:rgba(119,227,157,.45)}.pill.off{color:#ffe0e0;border-color:rgba(255,112,112,.45)}.pill.warn{color:#fff1c2;border-color:rgba(255,209,102,.45)}.memtext{font-size:15px;white-space:pre-wrap;margin:8px 0 13px}.memsummary{display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}.recall{margin-top:8px;color:#b9c5dc;font-size:12px}.selectbox{width:18px;height:18px;accent-color:var(--cyan);margin-right:8px}.meta{color:var(--muted);font-size:12px}.kv{display:grid;grid-template-columns:78px 1fr;gap:4px 10px}.grow{flex:1}.quality{height:6px;border-radius:999px;background:#263045;overflow:hidden;margin:10px 0}.quality span{display:block;height:100%;background:var(--green)}.quality.mid span{background:var(--yellow)}.quality.low span{background:var(--red)}.memactions{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}.empty{grid-column:1/-1;border:1px dashed var(--line);border-radius:18px;padding:42px;text-align:center;color:var(--muted);background:rgba(17,22,32,.45)}.empty b{display:block;color:var(--text);font-size:16px;margin-bottom:6px}.skeleton{grid-column:1/-1;display:grid;grid-template-columns:repeat(auto-fill,minmax(340px,1fr));gap:14px}.skeleton div{height:208px;border-radius:19px;border:1px solid var(--line);background:linear-gradient(90deg,rgba(17,22,32,.55),rgba(29,37,53,.8),rgba(17,22,32,.55));background-size:200% 100%;animation:pulse 1.2s infinite}@keyframes pulse{to{background-position:-200% 0}}
dialog{border:1px solid var(--line);border-radius:22px;background:var(--panel);color:var(--text);width:min(840px,calc(100vw - 38px));box-shadow:var(--shadow)}dialog::backdrop{background:rgba(0,0,0,.58);backdrop-filter:blur(4px)}.modal-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}.modal-head h3{margin:0}.x{border:0;background:transparent;color:var(--muted);font-size:24px}.form{display:grid;gap:12px}.form textarea,.form input,.form select{width:100%;border:1px solid var(--line);background:#0d111a;color:var(--text);border-radius:13px;padding:12px}.form textarea{min-height:120px}.formgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.pre{white-space:pre-wrap;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:12px;max-height:430px;overflow:auto;background:#0d111a;border:1px solid var(--line);border-radius:14px;padding:14px}.toast{position:fixed;right:24px;bottom:24px;background:var(--panel3);border:1px solid var(--line);border-radius:14px;padding:12px 14px;box-shadow:var(--shadow);display:none}.tabs{display:flex;gap:8px;margin-bottom:12px}.tabs button{border:1px solid var(--line);background:transparent;color:var(--muted);border-radius:999px;padding:7px 10px}.tabs button.on{background:var(--panel3);color:var(--text)}
@media(max-width:1280px){.cards{grid-template-columns:repeat(3,minmax(160px,1fr))}}@media(max-width:1180px){.top{grid-template-columns:1fr}.actions{justify-content:flex-start}.cards{grid-template-columns:1fr 1fr}}@media(max-width:980px){.app{grid-template-columns:1fr;overflow:visible}.side{position:relative;height:auto}.side-foot{margin-top:18px}.toolbar{grid-template-columns:1fr}.top{display:block}.actions{margin-top:14px}.statusline{align-items:flex-start;flex-direction:column}}@media(max-width:560px){.cards{grid-template-columns:1fr}.grid{grid-template-columns:1fr}.formgrid{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="app">
  <aside class="side">
    <div class="brand"><div class="logo">✦</div><div><h1>Horizon Context Memory</h1><p>local memory cockpit</p></div></div>
    <nav class="nav">
      <button class="active" data-view="all" data-state="all">全部</button>
      <button data-view="user" data-state="all">USER</button>
      <button data-view="memory" data-state="all">MEMORY</button>
      <button data-view="all" data-state="review">待处理</button>
    </nav>
    <div class="side-foot">本地地址 · 127.0.0.1<br/>数据目录 · ~/.codex/hcm</div>
  </aside>
  <main class="main">
    <div class="top">
      <div class="title"><h2>记忆管理</h2><p class="muted">自动写入、自动维护；网页端只处理查看、编辑、开关、删除和复核。</p></div>
      <div class="actions">
        <button class="btn danger" id="purgeDisabledBtn">删除关闭记忆</button>
        <button class="btn" id="exportBtn">导出 ZIP</button>
        <button class="btn primary" id="addBtn">新增记忆</button>
      </div>
    </div>
    <div class="statusline"><div class="statusleft"><span class="statusdot" id="statusDot"></span><span id="statusText">正在读取记忆池</span></div><div class="statusright" id="depthText">深度池初始化中</div></div>
    <section class="cards">
      <div class="card"><div class="metric"><span>USER</span><b id="userCount">0</b></div><div class="bar"><span id="userBar" style="width:0%"></span></div><p class="meta" id="userMeta"></p></div>
      <div class="card"><div class="metric"><span>MEMORY</span><b id="memCount">0</b></div><div class="bar"><span id="memBar" style="width:0%"></span></div><p class="meta" id="memMeta"></p></div>
      <div class="card"><div class="metric"><span>待处理</span><b id="reviewCount">0</b></div><p class="meta" id="reviewMeta"></p></div>
      <div class="card"><div class="metric"><span>召回深度</span><b id="recallDepth">0</b></div><p class="meta" id="depthMeta"></p></div>
      <div class="card"><div class="metric"><span>总量</span><b id="totalCount">0</b></div><p class="meta" id="totalMeta"></p></div>
    </section>
    <div class="toolbar">
      <input id="q" class="field search" placeholder="搜索内容、项目、类型、范围、证据或 ID" />
      <select id="scopeFilter" class="field"><option value="all">全部范围</option></select>
      <select id="typeFilter" class="field"><option value="all">全部类型</option></select>
      <button class="btn" id="historyBtn">搜索历史</button>
    </div>
    <div id="batchBar" class="batchbar hidden"><span id="selectedMeta">已选择 0 条</span><button class="mini" id="batchEnable">批量启用</button><button class="mini" id="batchDisable">批量停用</button><button class="mini" id="batchClear">清除复核</button><button class="mini danger" id="batchDelete">批量删除</button><button class="mini" id="batchCancel">取消选择</button></div>
    <section id="grid" class="grid"></section>
  </main>
</div>

<dialog id="editDialog">
  <div class="modal-head"><h3 id="editTitle">记忆</h3><button class="x" onclick="editDialog.close()">×</button></div>
  <div class="form">
    <div class="formgrid">
      <label>文件<select id="domain"><option value="user">USER 用户偏好</option><option value="memory">MEMORY 项目/流程记忆</option></select></label>
      <label>类型<input id="typeInput" placeholder="preference / workflow / tooling" /></label>
      <label>范围<select id="scopeInput"><option value="global">global</option><option value="project">project</option><option value="machine">machine</option><option value="workflow">workflow</option><option value="tool">tool</option></select></label>
      <label>生命周期<select id="lifecycleInput"><option value="">自动</option><option value="short">short</option><option value="project">project</option><option value="long">long</option><option value="permanent">permanent</option></select></label>
      <label>项目<input id="projectInput" placeholder="global 或 ~/path/project" /></label>
      <label>过期时间<input id="expiresInput" type="datetime-local" /></label>
      <label>复核标记<input id="reviewInput" placeholder="留空表示清除" /></label>
    </div>
    <label>内容<textarea id="text"></textarea></label>
    <label>复核原因<textarea id="reviewReasonInput" placeholder="可选"></textarea></label>
    <div class="row"><button class="btn primary" id="saveBtn">保存</button><button class="btn" onclick="editDialog.close()">取消</button></div>
  </div>
</dialog>

<dialog id="detailDialog">
  <div class="modal-head"><h3 id="detailTitle">记忆详情</h3><button class="x" onclick="detailDialog.close()">×</button></div>
  <div class="tabs"><button class="on" data-tab="detail">详情</button><button data-tab="evidence">证据链</button></div>
  <div id="detailBody" class="pre"></div>
</dialog>

<dialog id="outputDialog">
  <div class="modal-head"><h3 id="outputTitle">结果</h3><button class="x" onclick="outputDialog.close()">×</button></div>
  <pre class="pre" id="output"></pre>
  <div class="row" id="outputActions" style="margin-top:12px"></div>
</dialog>
<div class="toast" id="toast"></div>

<script>
let view='all', state='all', scope='all', type='all', query='', editing=null, memories=[], facets={scopes:[],types:[]}, currentConfig={}, lastStatus={}, selected=new Set();
const $=s=>document.querySelector(s); const $$=s=>[...document.querySelectorAll(s)];
function toast(text){const el=$('#toast');el.textContent=text;el.style.display='block';setTimeout(()=>el.style.display='none',2300)}
async function api(url,opt){const r=await fetch(url,opt);const data=await r.json();if(!r.ok)throw new Error(data.error||r.statusText);return data}
function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function dtLocal(value){if(!value)return'';const d=new Date(value);if(Number.isNaN(d.getTime()))return'';const z=n=>String(n).padStart(2,'0');return `${d.getFullYear()}-${z(d.getMonth()+1)}-${z(d.getDate())}T${z(d.getHours())}:${z(d.getMinutes())}`}
function fromDtLocal(value){return value?new Date(value).toISOString():null}
function qualityClass(score){return score<60?'low':score<80?'mid':'high'}
function renderOptions(select, values, label){const current=select.value||'all';select.innerHTML=`<option value="all">${label}</option>`+values.map(v=>`<option value="${esc(v)}">${esc(v)}</option>`).join('');select.value=values.includes(current)?current:'all'}
async function load(){renderLoading();const data=await api(`/api/state?domain=${view}&state=${state}&scope=${scope}&type=${type}&q=${encodeURIComponent(query)}`);memories=data.memories;facets=data.facets||facets;currentConfig=data.config||{};selected=new Set([...selected].filter(id=>memories.some(m=>m.id===id)));renderStatus(data.status);renderFacets();renderConfig();renderBatchBar();renderMemories(data.memories)}
function renderLoading(){const grid=$('#grid');if(grid&&!memories.length)grid.innerHTML='<div class="skeleton"><div></div><div></div><div></div></div>';$('#statusText').innerHTML='<b>同步中</b> · 正在读取本地深度记忆池'}
function renderStatus(s){lastStatus=s;const auto=s.autoMaintenance||{};const depth=s.depth||{};const buckets=s.pendingBuckets||{};const autoText=auto.running?'自动维护中':(auto.lastRunAt?`上次维护 ${new Date(auto.lastRunAt).toLocaleString()}`:'自动维护待启动');$('#statusText').innerHTML=`<b>${auto.running?'维护中':'深度记忆池已就绪'}</b> · ${autoText}`;$('#depthText').textContent=`存储 ${depth.stored||s.total}/${depth.maxStored||5000} · 每轮召回 ${depth.retrieved||24} 条`;$('#userCount').textContent=s.user.count;$('#memCount').textContent=s.memory.count;$('#totalCount').textContent=s.total;$('#reviewCount').textContent=s.pending??0;$('#recallDepth').textContent=depth.retrieved||24;$('#userBar').style.width=Math.min(100,s.user.percent)+'%';$('#memBar').style.width=Math.min(100,s.memory.percent)+'%';$('#userMeta').textContent=`${s.user.chars}/${s.user.limit} 字 · ${s.user.percent}%`;$('#memMeta').textContent=`${s.memory.chars}/${s.memory.limit} 字 · ${s.memory.percent}%`;$('#reviewMeta').textContent=`复核 ${buckets.review||0} · 候选 ${buckets.candidate||0} · 建议清理 ${buckets.cleanupSuggested||0} · 低质量 ${buckets.lowQuality||0} · 已停用 ${buckets.disabled||0}`;$('#depthMeta').textContent=`存储上限 ${depth.maxStored||5000} · 启用上限 ${depth.enabledMax||2000}`;$('#totalMeta').textContent=`${autoText} · root ${s.root||''}`;const purge=$('#purgeDisabledBtn');if(purge)purge.textContent=`删除关闭记忆${s.disabled?` (${s.disabled})`:''}`}
function renderFacets(){renderOptions($('#scopeFilter'),facets.scopes||[],'全部范围');renderOptions($('#typeFilter'),facets.types||[],'全部类型')}
function renderConfig(){const auto=$('#autoReview'),skill=$('#skillProposal'),mine=$('#patternMine');if(auto)auto.checked=currentConfig.autoLlmReview===true;if(skill)skill.checked=currentConfig.autoCreateSkillProposals!==false;if(mine)mine.checked=currentConfig.autoMineMemoryCandidates!==false}
function renderMemories(list){const grid=$('#grid');if(!list.length){grid.innerHTML=`<div class="empty"><b>${query?'没有匹配结果':'当前视图没有待处理项'}</b>${query?'换一个关键词、范围或类型再试。':'记忆池会继续在后台自动沉淀和维护。'}</div>`;return}grid.innerHTML=list.map(m=>{const score=m.quality?.score??0;const reasons=m.quality?.reasons||[];const audit=m.lifecycle_audit||{};const recall=(m.recall||[]).slice(0,3).join(' · ');const checked=selected.has(m.id)?'checked':'';return `<article class="card memory ${selected.has(m.id)?'selected':''}"><header><div><input class="selectbox" type="checkbox" ${checked} onchange="selectMemory('${m.id}', this.checked)"><span class="pill domain-${m.domain}">${m.domain==='user'?'USER':'MEMORY'}</span> <span class="pill ${m.status==='disabled'?'off':'on'}">${m.status==='disabled'?'OFF':'ON'}</span> ${m.review?`<span class="pill warn">${esc(m.review)}</span>`:''} ${audit.cleanup?'<span class="pill warn">CLEANUP</span>':''}</div><span class="meta">${esc(m.id)}</span></header><div class="grow"><div class="memtext memsummary">${esc(m.text)}</div><div class="quality ${qualityClass(score)}"><span style="width:${score}%"></span></div><div class="kv meta"><span>质量</span><span>${score}/100 ${reasons.length?'· '+esc(reasons.join(', ')):''}</span><span>范围</span><span>${esc(m.scope||'-')} · ${esc(m.project||'-')}</span><span>类型</span><span>${esc(m.type||'-')}</span><span>生命周期</span><span>${esc(m.lifecycle||audit.tier||'-')}</span><span>使用</span><span>hits ${m.hits||0} · used ${m.usedCount||0}</span></div>${recall?`<div class="recall">召回依据：${esc(recall)}</div>`:''}</div><div class="memactions"><button class="mini" onclick="toggle('${m.id}')">${m.status==='disabled'?'开启':'关闭'}</button><button class="mini" onclick="detail('${m.id}')">详情</button><button class="mini" onclick="evidence('${m.id}')">证据</button><button class="mini" onclick="edit('${m.id}')">编辑</button><button class="mini danger" onclick="del('${m.id}')">删除</button></div></article>`}).join('')}
function renderBatchBar(){const bar=$('#batchBar');const count=selected.size;$('#selectedMeta').textContent=`已选择 ${count} 条`;bar.classList.toggle('hidden',count===0)}
function selectMemory(id,checked){if(checked)selected.add(id);else selected.delete(id);renderBatchBar();renderMemories(memories)}
async function batch(action){if(!selected.size)return toast('先选择记忆');if(action==='delete'&&!confirm('确认批量删除选中记忆？'))return;await api('/api/memory/batch',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({action,ids:[...selected]})});selected.clear();toast('批量操作完成');load()}
async function purgeDisabled(){const count=lastStatus.disabled||0;if(!count)return toast('没有关闭的记忆');if(!confirm(`确认删除 ${count} 条已关闭记忆？删除前会自动备份。`))return;const r=await api('/api/memory/purge-disabled',{method:'POST'});selected.clear();toast(`已删除 ${r.deleted||0} 条关闭记忆`);load()}
function edit(id){editing=memories.find(m=>m.id===id)||null;$('#editTitle').textContent=editing?'编辑记忆':'新增记忆';$('#domain').value=editing?.domain||'user';$('#domain').disabled=!!editing;$('#typeInput').value=editing?.type||'';$('#scopeInput').value=editing?.scope||($('#domain').value==='memory'?'project':'global');$('#lifecycleInput').value=editing?.lifecycle||'';$('#projectInput').value=editing?.project||($('#domain').value==='memory'?'':'global');$('#expiresInput').value=dtLocal(editing?.expiresAt);$('#reviewInput').value=editing?.review||'';$('#reviewReasonInput').value=editing?.review_reason||'';$('#text').value=editing?.text||'';editDialog.showModal()}
async function toggle(id){const m=memories.find(x=>x.id===id);await api('/api/memory/'+id,{method:'PATCH',headers:{'content-type':'application/json'},body:JSON.stringify({status:m.status==='disabled'?'enabled':'disabled'})});toast('已更新');load()}
async function del(id){if(!confirm('确认删除这条记忆？'))return;await api('/api/memory/'+id,{method:'DELETE'});toast('已删除');load()}
function detailText(m){return JSON.stringify({id:m.id,domain:m.domain,status:m.status,type:m.type,scope:m.scope,project:m.project,text:m.text,quality:m.quality,lifecycle:m.lifecycle,lifecycle_audit:m.lifecycle_audit,confidence:m.confidence,evidence:m.evidence,evidence_event_ids:m.evidence_event_ids||[],correction_event_ids:m.correction_event_ids||[],review:m.review,review_reason:m.review_reason,expiresAt:m.expiresAt,source:m.source,cwd:m.cwd,created:m.created,updated:m.updated,lastSeen:m.lastSeen,hits:m.hits,usedCount:m.usedCount,lastUsedAt:m.lastUsedAt,skillProposalId:m.skillProposalId},null,2)}
function detail(id){const m=memories.find(x=>x.id===id);if(!m)return;$('#detailTitle').textContent=`记忆详情 · ${m.id}`;$('#detailBody').textContent=detailText(m);detailDialog.showModal()}
async function evidence(id){const m=memories.find(x=>x.id===id);$('#detailTitle').textContent=`证据链 · ${id}`;$('#detailBody').textContent='加载中...';detailDialog.showModal();const r=await api('/api/evidence?ids='+encodeURIComponent(id));$('#detailBody').textContent=JSON.stringify({memory:m,evidence_events:r.events},null,2)}
async function saveMemory(){const payload={domain:$('#domain').value,text:$('#text').value,type:$('#typeInput').value,scope:$('#scopeInput').value,lifecycle:$('#lifecycleInput').value||null,project:$('#projectInput').value,expiresAt:fromDtLocal($('#expiresInput').value),review:$('#reviewInput').value||undefined,review_reason:$('#reviewReasonInput').value||undefined};if(editing)await api('/api/memory/'+editing.id,{method:'PATCH',headers:{'content-type':'application/json'},body:JSON.stringify(payload)});else await api('/api/memory',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify(payload)});editDialog.close();toast('已保存');load()}
async function run(title,url,method='POST',body=null){$('#outputTitle').textContent=title;$('#output').textContent='运行中...';$('#outputActions').innerHTML='';outputDialog.showModal();try{const r=await api(url,{method,headers:{'content-type':'application/json'},body:body?JSON.stringify(body):undefined});$('#output').textContent=r.output||JSON.stringify(r,null,2);load()}catch(e){$('#output').textContent=e.message}}
async function proposals(){ $('#outputTitle').textContent='技能候选'; $('#output').textContent='加载中...'; $('#outputActions').innerHTML=''; outputDialog.showModal(); const r=await api('/api/proposals'); if(!r.proposals.length){$('#output').textContent='没有待处理技能候选。';return} $('#output').textContent=r.proposals.map((p,i)=>`${i+1}. ${p.title}\nfile: ${p.file}\nsource: ${p.source_memory||'-'}\nmtime: ${p.mtime}\n`).join('\n'); $('#outputActions').innerHTML=r.proposals.map((p,i)=>`<button class="btn" onclick="installProposal(${i})">安装候选 ${i+1}</button>`).join(''); window.__proposals=r.proposals; }
async function installProposal(index){const p=window.__proposals?.[index];if(!p)return;await run('安装技能候选','/api/proposals/install','POST',{file:p.file})}
async function audit(){ $('#outputTitle').textContent='审计日志'; $('#output').textContent='加载中...'; $('#outputActions').innerHTML=''; outputDialog.showModal(); const r=await api('/api/audit?limit=100'); $('#output').textContent=r.audit.map((a,i)=>{const id=a.before?.id||a.after?.id||a.memory_id||'-';const text=a.after?.text||a.before?.text||'-';const before=a.before&&a.after&&a.before.text!==a.after.text?`\n  变更前：${a.before.text}`:'';return `${i+1}. ${a.ts} · ${a.action}\n  记忆：${id}\n  内容：${text}${before}\n`;}).join('\n')||'暂无审计日志'; $('#outputActions').innerHTML=r.audit.filter(a=>a.before).slice(0,10).map((a,i)=>`<button class="btn" onclick="restoreAudit('${a.id}')">恢复 ${i+1}</button>`).join(''); window.__audit=r.audit; }
async function restoreAudit(id){await run('恢复审计记忆','/api/audit/restore','POST',{audit_id:id})}
async function summary(){await run('项目启动摘要','/api/summary','GET')}
function exportZip(){window.location.href='/api/export.zip';toast('正在生成导出包')}
async function setConfig(patch){const r=await api('/api/config',{method:'PATCH',headers:{'content-type':'application/json'},body:JSON.stringify(patch)});currentConfig=r.config;renderConfig();toast('配置已更新')}
function bind(id,fn,event='onclick'){const el=$('#'+id);if(el)el[event]=fn}
bind('saveBtn',saveMemory);bind('batchEnable',()=>batch('enable'));bind('batchDisable',()=>batch('disable'));bind('batchClear',()=>batch('clear-review'));bind('batchDelete',()=>batch('delete'));bind('batchCancel',()=>{selected.clear();renderBatchBar();renderMemories(memories)});bind('addBtn',()=>edit(null));bind('purgeDisabledBtn',purgeDisabled);bind('exportBtn',exportZip);bind('summaryBtn',summary);bind('proposalBtn',proposals);bind('auditBtn',audit);bind('evolveBtn',()=>run('演化扫描','/api/evolve'));bind('consolidateBtn',()=>run('整理去重','/api/consolidate'));bind('healthBtn',()=>run('健康检查','/api/health'));bind('reindexBtn',()=>run('重建索引','/api/reindex'));bind('backupBtn',()=>run('备份','/api/backup'));bind('llmBtn',()=>run('LLM 复核','/api/llm-review'));const runHistory=async()=>{const q=$('#q').value.trim();if(!q)return toast('先输入搜索词');await run('历史搜索','/api/search?q='+encodeURIComponent(q),'GET')};bind('historyBtn',runHistory);bind('historyBtnTop',runHistory);
$('#q').oninput=e=>{query=e.target.value;load()};$('#scopeFilter').onchange=e=>{scope=e.target.value;load()};$('#typeFilter').onchange=e=>{type=e.target.value;load()};bind('autoReview',e=>setConfig({autoLlmReview:e.target.checked}),'onchange');bind('skillProposal',e=>setConfig({autoCreateSkillProposals:e.target.checked}),'onchange');bind('patternMine',e=>setConfig({autoMineMemoryCandidates:e.target.checked}),'onchange');
$$('.nav button').forEach(b=>b.onclick=()=>{$$('.nav button').forEach(x=>x.classList.remove('active'));b.classList.add('active');view=b.dataset.view;state=b.dataset.state;selected.clear();load()});
$$('.tabs button').forEach(b=>b.onclick=()=>{$$('.tabs button').forEach(x=>x.classList.remove('on'));b.classList.add('on')});
$$('.actionmenu button').forEach(b=>b.addEventListener('click',()=>b.closest('details')?.removeAttribute('open')));
document.addEventListener('click',e=>{$$('.actionmenu[open]').forEach(m=>{if(!m.contains(e.target))m.removeAttribute('open')})});
load().catch(e=>toast(e.message));
</script>
</body>
</html>
